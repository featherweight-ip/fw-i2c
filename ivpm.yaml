$schema: https://fvutils.github.io/ivpm/ivpm.schema.json

package:
  name: fw-i2c
  version: "0.1.0"
  description: >-
    I2C controller IP written with fw-hdl, verified back-to-back against the
    freecores (OpenCores) i2c core and compared with it for area.
  license: Apache-2.0
  default-dep-set: dev

  dep-sets:
  # What a consumer of the IP needs: the fw-hdl library and the I2C/Wishbone
  # protocol kits the controller is built on.
  - name: use
    description: fw-hdl and the protocol kits; what a consuming project fetches.
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev
    - name: fw-proto-i2c
      url: https://github.com/featherweight-ip/fw-proto-i2c.git
      dep-set: use
    - name: fw-proto-wb
      url: https://github.com/featherweight-ip/fw-proto-wb.git
      dep-set: use

  # Building, verifying, lowering, synthesizing and documenting the IP.
  - name: dev
    description: The use set plus the reference core, VIP, tools and Sphinx.
    uses: [use]
    deps:
    - name: fw-hdl
      url: https://github.com/featherweight-hdl/fw-hdl.git
      dep-set: default-dev

    # Reference implementation: the freecores mirror of the OpenCores
    # i2c core (Herveille master + Baier slave extension). Pinned to the
    # commit the reference spec in docs/reference/ was written against.
    - name: i2c
      url: https://github.com/freecores/i2c.git
      commit: 3b067f0
      deps: skip

    # Registers: SystemRDL -> fw-hdl register model.
    - name: peakrdl-fw-hdl
      url: https://git.dvkit.org/featherweight-hdl/peakrdl-fw-hdl.git
      dep-set: default-dev
    - name: dv-flow-librdl
      url: https://git.dvkit.org/dv-flow/dv-flow-librdl.git
      dep-set: default-dev

    # Verification: I2C and Wishbone VIP for the back-to-back bench.
    - name: fwvip-i2c
      url: https://github.com/featherweight-vip/fwvip-i2c.git
      deps: skip
    - name: fwvip-wb
      url: https://github.com/featherweight-vip/fwvip-wb.git
      dep-set: use

    # Flow
    - name: dv-flow-mgr
      url: https://github.com/dv-flow/dv-flow-mgr.git
      dep-set: default-dev
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
      dep-set: default-dev

    # Tools
    - name: verilator
      src: gh-rls
      url: https://github.com/edapack/verilator-bin
      cache: true
    - name: yosys
      src: gh-rls
      url: https://github.com/edapack/yosys-bin
      cache: true
      dep-set: default
    # Target: iCE40UP5K (iCEBreaker) place and route.
    - name: nextpnr
      src: gh-rls
      url: https://github.com/edapack/nextpnr-bin
      cache: true

    # Documentation (docs/): Sphinx + MyST, register tables rendered from
    # SystemRDL by sphinx-peakrdl, timing diagrams by WaveDrom, FSMs by Mermaid.
    - { name: sphinx, src: pypi }
    - { name: myst-parser, src: pypi }
    - { name: furo, src: pypi }
    - { name: sphinx-copybutton, src: pypi }
    - { name: peakrdl, src: pypi }
    - { name: sphinx-peakrdl, src: pypi }
    - { name: sphinxcontrib-wavedrom, src: pypi, version: ">=3.0.4" }  # 1.x breaks on Sphinx 9
    - { name: sphinxcontrib-mermaid, src: pypi }
    # NOTE: fw-hdl's dfm plugin (packages/fw-hdl/python) is not at the repo
    # root, so ivpm does not install it. Install it once by hand:
    #   pip install -e packages/fw-hdl/python
