# dv-flow (dfm) project file for fw-i2c.
#
#   dfm run docs       Build the Sphinx documentation (warnings are errors).
#   dfm run tests      Every simulation case.
#   dfm run lint-rtl   Verilator lint of the RTL (reference core + shim).
#
# More lowering, simulation and synthesis tasks are added as the plan in
# docs/design/plan.md proceeds.
package:
  name: org.fwip.i2c

  # The methodology-neutral DV archetype (dv-flow-libproject): the standard
  # verbs (tests, smoke, lint-rtl, tests-info, --sim, --build).
  uses: project.dv.uvm
  package-map: "${{ env.IVPM_PACKAGES }}/dv-flow-package-map.yaml"

  with:
    images:
      type: list
      value: [ref, ref-eq, tlm, tlm-eq]
      values: [ref, ref-eq, tlm, tlm-eq]
      cli: true
      desc: Views the universal tests run on (bench-plan §3.4); ref-eq is the equivalence self-test (R76 vs R76)
    view_tb:
      type: map
      value:
        ref:    [oc_i2c_ref_arm.sv, hdl_top_ref.sv, hvl_top_ref.sv]
        ref-eq: [oc_i2c_ref_arm.sv, hdl_top_ref_eq.sv, hvl_top_ref_eq.sv]
        tlm:    [fw_i2c_tlm_view_pkg.sv, hdl_top_spl.sv, hvl_top_spl.sv]
        tlm-eq: [oc_i2c_ref_arm.sv, fw_i2c_tlm_view_pkg.sv, hdl_top_spl_eq.sv, hvl_top_spl_eq.sv]
    view_top:
      type: map
      value:
        ref:    [hvl_top_ref]
        ref-eq: [hvl_top_ref_eq]
        tlm:    [hvl_top_spl]
        tlm-eq: [hvl_top_spl_eq]

  imports:
  - project.dv.uvm
  - hdlsim
  - hdllint
  - fw.proto.wb
  - fw.proto.i2c
  - fw-hdl
  - rdl

  fragments:
  - src/rdl/flow.yaml
  - src/pss/flow.yaml
  - src/ref/flow.yaml
  - src/spl/flow.yaml
  - tests/uvm/flow.yaml

  tasks:
  - override: src-rtl
    needs: [ref-rtl]

  - override: src-spl
    needs: [spl]

  - override: lint-rtl
    needs: [lint]

  - name: lint
    uses: hdllint.Rtl
    needs: [src-rtl]
    with:
      top: [oc_i2c_wb32]
      waivers: lint-waivers.yaml

  - override: tests
    needs: [uvm.uvm-universal, uvm.uvm-eq-selftest, uvm.uvm-ref-only, uvm.uvm-fixed]

  - override: smoke
    needs: [uvm.uvm-universal]
    with:
      tests: [uvm-universal.smoke]

  - name: docs-build
    uptodate: false
    shell: bash
    run: sphinx-build -W --keep-going -q -b html "${{ rootdir }}/docs" "$TASK_RUNDIR/html"
  - root: docs
    desc: Build the documentation with warnings as errors (HTML in the task's rundir)
    needs: [docs-build]
