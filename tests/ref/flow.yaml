# Directed test of the reference core behind the 32-bit shim
# (oc_i2c_wb32_tb.sv): fw-proto-wb initiator -> shim -> core -> I2C bus ->
# fw-proto-i2c target with a memory responder.
fragment:
  tasks:
  - name: ref-wb32-tb
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include:
      - oc_i2c_wb32_tb.sv

  - name: ref-wb32-img
    uses: hdlsim.SimImage
    needs: [ref-rtl, fw.proto.wb.files, fw.proto.i2c.files, ref-wb32-tb, flags-img]
    with:
      sim: "${{ sim }}"
      top: [oc_i2c_wb32_tb]

  - name: ref-wb32-run
    uses: hdlsim.SimRun
    needs: [ref-wb32-img, "flags-run-${{ build }}"]
    with:
      sim: "${{ sim }}"
      mode: test

  - name: ref-wb32
    uses: hdlsim.SimCheck
    needs: [ref-wb32-run]
    rundir: inherit
    with:
      name: ref_wb32
    tags:
    - std.Test: {name: ref_wb32}
