# yaml-language-server: $schema=https://dv-flow.github.io/flow.dv.schema.json
#
# The UVM bench (docs/design/bench-plan.md): one env and one set of common
# tests (env/, tests/), and one image per view (tb/). An image is a pair of
# tops from the project's view_tb/view_top maps; `images` picks the views
# the universal matrix runs.
fragment:
  name: uvm
  tasks:
  # The env and tests packages, compiled once. The operation model's generated
  # package and the protocol kits come first.
  - name: uvm-env
    uses: project.dv.uvm.utils.env-base
    needs:
    - pss.op-model-sv
    - fw.proto.wb.files
    - fw.proto.i2c.files
    - "flags-comp-${{ build }}"

  # Each view's design sources. `ref` is R76 behind the 32-bit shim.
  - { name: view-src-ref,    passthrough: all, consumes: none, needs: [ref-rtl] }
  # The equivalence self-test: two R76 arms (bench-plan §3.4, E4).
  - { name: view-src-ref-eq, passthrough: all, consumes: none, needs: [ref-rtl] }
  # fw-i2c: the class model at TLM, alone and against R76 (E7).
  - { name: view-src-tlm,    passthrough: all, consumes: none, needs: [spl] }
  - { name: view-src-tlm-eq, passthrough: all, consumes: none, needs: [spl, ref-rtl] }
  # fw-i2c behind pins, alone and against R76 (E8).
  - { name: view-src-wb,     passthrough: all, consumes: none, needs: [spl-rtl] }
  - { name: view-src-wb-eq,  passthrough: all, consumes: none, needs: [spl-rtl, ref-rtl] }

  - root: sim-img
    desc: Simulation image for one view
    with:
      view:
        type: str
        value: ref
        cli: true
        values: [ref, ref-eq, tlm, tlm-eq, wb, wb-eq]
        doc: View to build
    strategy:
      select:
        axes:
          view: [ref, ref-eq, tlm, tlm-eq, wb, wb-eq]
        default: {view: "${{ view }}"}
      body:
      - uses: project.dv.uvm.utils.tb-img
        needs:
        - uvm-env
        - "view-src-${{ this.view }}"
        - "flags-comp-${{ build }}"
        - "flags-elab-${{ build }}"
        with:
          tb_include: "${{ view_tb[this.view] }}"
          top:        "${{ view_top[this.view] }}"

  # The common tests, on every view in `images`.
  - name: uvm-universal
    strategy:
      matrix:
        image: "${{ images }}"
        case:
        - { name: smoke,   testname: fw_i2c_smoke_test,   plusargs: [] }
        - { name: reg,     testname: fw_i2c_reg_test,     plusargs: [] }
        - { name: write,   testname: fw_i2c_write_test,   plusargs: [] }
        - { name: read,    testname: fw_i2c_read_test,    plusargs: [] }
        - { name: nack,    testname: fw_i2c_nack_test,    plusargs: [] }
        - { name: irq,     testname: fw_i2c_irq_test,     plusargs: [] }
        - { name: prer,    testname: fw_i2c_prer_test,    plusargs: [] }
        - { name: stretch, testname: fw_i2c_stretch_test, plusargs: [] }
        - { name: addr10,  testname: fw_i2c_addr10_test,  plusargs: [] }
    body:
    - name: "${{ this.image }}-${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase
      needs:
      - "sim-img.${{ this.image }}"
      - "flags-run-${{ build }}"
      with:
        name: "${{ this.image }}-${{ this.case.name }}"
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  # The rest of the equivalence self-test on ref-eq (bench-plan §3.4): a
  # sabotaged mirror must be caught, and every common test must still pass
  # with R76's PRER scaled (the timing report shows the ratio).
  - name: uvm-eq-selftest
    strategy:
      matrix:
        case:
        - { name: sabotage,      testname: fw_i2c_eq_sabotage_test, plusargs: [] }
        - { name: smoke-x2,      testname: fw_i2c_smoke_test,   plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: reg-x2,        testname: fw_i2c_reg_test,     plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: write-x2,      testname: fw_i2c_write_test,   plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: read-x2,       testname: fw_i2c_read_test,    plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: nack-x2,       testname: fw_i2c_nack_test,    plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: irq-x2,        testname: fw_i2c_irq_test,     plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: prer-x2,       testname: fw_i2c_prer_test,    plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: stretch-x2,    testname: fw_i2c_stretch_test, plusargs: [EQ_REF_PRER_SCALE=2] }
        - { name: addr10-x2,     testname: fw_i2c_addr10_test,  plusargs: [EQ_REF_PRER_SCALE=2] }
    body:
    - name: "ref-eq-${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase
      needs:
      - "sim-img.ref-eq"
      - "flags-run-${{ build }}"
      with:
        name: "ref-eq-${{ this.case.name }}"
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  # The reference confirmation tests (bench-plan E3): R76 alone, with the
  # probe the `ref` top publishes. Results: docs/reference/deviations.md.
  - name: uvm-ref-only
    strategy:
      matrix:
        case:
        - { name: timing-sm, testname: fw_i2c_ref_timing_test,     plusargs: [I2C_MODE=sm] }
        - { name: timing-fm, testname: fw_i2c_ref_timing_test,     plusargs: [I2C_MODE=fm] }
        - { name: cr-race,   testname: fw_i2c_ref_cr_race_test,    plusargs: [] }
        - { name: en-midbyte, testname: fw_i2c_ref_en_midbyte_test, plusargs: [] }
        - { name: prer1,     testname: fw_i2c_ref_prer_min_test,   plusargs: [PRER=1] }
        - { name: prer0,     testname: fw_i2c_ref_prer_min_test,   plusargs: [PRER=0] }
        - { name: arb,       testname: fw_i2c_ref_arb_test,        plusargs: [] }
    body:
    - name: "ref-${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase
      needs:
      - "sim-img.ref"
      - "flags-run-${{ build }}"
      with:
        name: "ref-${{ this.case.name }}"
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  # Defects R76 has and fw-i2c fixes (OI-6, design §8.1), on the fw-i2c views:
  # alone the tests must pass; against R76 the scoreboards must see the
  # difference and count it under the defect's rule (EQ_EXPECT).
  - name: uvm-fixed
    strategy:
      matrix:
        image: [tlm, tlm-eq]
        case:
        - { name: d7-prer1-smoke, testname: fw_i2c_smoke_test, plusargs: [PRER=1, EQ_EXPECT=d7] }
        - { name: d7-prer0-smoke, testname: fw_i2c_smoke_test, plusargs: [PRER=0, EQ_EXPECT=d7] }
        - { name: d7-prer1-read,  testname: fw_i2c_read_test,  plusargs: [PRER=1, EQ_EXPECT=d7] }
        - { name: d7-prer0-write, testname: fw_i2c_write_test, plusargs: [PRER=0, EQ_EXPECT=d7] }
    body:
    - name: "${{ this.image }}-${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase
      needs:
      - "sim-img.${{ this.image }}"
      - "flags-run-${{ build }}"
      with:
        name: "${{ this.image }}-${{ this.case.name }}"
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"

  # UM10204 timing of fw-i2c behind pins (D8, D10 fixed; OI-6, design §8.1).
  - name: uvm-um10204
    strategy:
      matrix:
        case:
        - { name: um10204-sm, testname: fw_i2c_um10204_test, plusargs: [I2C_MODE=sm] }
        - { name: um10204-fm, testname: fw_i2c_um10204_test, plusargs: [I2C_MODE=fm] }
    body:
    - name: "wb-${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase
      needs:
      - "sim-img.wb"
      - "flags-run-${{ build }}"
      with:
        name: "wb-${{ this.case.name }}"
        testname: "${{ this.case.testname }}"
        plusargs: "${{ this.case.plusargs }}"
